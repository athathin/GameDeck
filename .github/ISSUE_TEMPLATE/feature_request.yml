name: Suggestion
description: An idea to make GameDeck better
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for your idea! Every suggestion is read, but not every one can be added.
  - type: textarea
    id: idea
    attributes:
      label: What would you like GameDeck to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do that is hard or impossible now?
  - type: dropdown
    id: mode
    attributes:
      label: Which part is it about?
      options:
        - Desktop mode
        - Big Picture mode
        - Both
        - Updating
        - Something else
