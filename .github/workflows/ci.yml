# Builds GameDeck and runs the tests for every proposed change (pull request), so a change that breaks something is noticed
# before it is accepted. (The Release workflow also runs the tests before it publishes anything.)
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GameDeck.slnx -c Release

      - name: Test
        run: dotnet test GameDeck.Tests/GameDeck.Tests.csproj -c Release --no-build
