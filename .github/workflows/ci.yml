# Builds GameDeck for every proposed change (pull request), so a change that doesn't build is noticed before it is accepted.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GameDeck.slnx -c Release
