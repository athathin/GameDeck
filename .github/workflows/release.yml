# Publishes a new GameDeck release whenever the version in GameDeck/GameDeck.csproj is raised and pushed to main.
# The tests run first (a failing test stops the release). Both programs (64-bit and 32-bit) are then built here and attached to
# the release, with the version's section of CHANGELOG.md as release notes (or, without one, the commit messages since the
# previous release). GameDeck itself looks at the latest
# release each time it starts and installs the newer version (see Services/UpdateService.cs), so the file names below must
# stay GameDeck-win-x64.exe and GameDeck-win-x86.exe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, to find what changed since the last release

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content GameDeck/GameDeck.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> in GameDeck.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Is this version already released?
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" *> $null
          "released=$($LASTEXITCODE -eq 0)".ToLower() >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v6
        if: steps.exists.outputs.released == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Run the tests
        if: steps.exists.outputs.released == 'false'
        shell: pwsh
        run: |
          dotnet test GameDeck.Tests/GameDeck.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'The tests failed, so no release is made.' }

      - name: Build the 64-bit and 32-bit programs
        if: steps.exists.outputs.released == 'false'
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-x86') {
            dotnet publish GameDeck/GameDeck.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:GameDeckInnerPublish=true -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $rid" }
            Move-Item "out/$rid/GameDeck.exe" "out/GameDeck-$rid.exe"
          }

      - name: Write the release notes
        if: steps.exists.outputs.released == 'false'
        shell: pwsh
        run: |
          # the version's section of CHANGELOG.md ("## 1.3.0 (date)" up to the next "## "); GameDeck shows these notes after updating
          $version = '${{ steps.version.outputs.version }}'
          $notes = $null
          if (Test-Path CHANGELOG.md) {
            $changelog = (Get-Content CHANGELOG.md -Raw) -replace "`r`n", "`n"
            $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^`n]*`n(.*?)(?=^## |\z)")
            if ($section.Success) { $notes = $section.Groups[1].Value.Trim() }
          }

          # no section for this version: the first line of every commit since the previous release, without the "Version x.y.z: " start
          if (-not $notes) {
            $previous = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
            $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
            $notes = git log $range --no-merges --pretty=format:'%s' |
              ForEach-Object { $_ -replace '^(Version [0-9.]+|Beta):\s*', '' } |
              Where-Object { $_ } |
              ForEach-Object { "- $_" }
            if (-not $notes) { $notes = '- Improvements and fixes' }
          }

          $notes | Set-Content -Path release-notes.md -Encoding utf8

      - name: Create the release
        if: steps.exists.outputs.released == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" `
            "out/GameDeck-win-x64.exe#GameDeck for 64-bit Windows (most PCs)" `
            "out/GameDeck-win-x86.exe#GameDeck for 32-bit Windows" `
            --title "GameDeck ${{ steps.version.outputs.version }}" --notes-file release-notes.md
